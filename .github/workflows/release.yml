name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the job proves its identity to npm with an OIDC token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Opens or updates a "Version Packages" PR while changesets are pending, and
      # publishes to npm once that PR is merged. Each package on npmjs.com lists this
      # repository and workflow file as a trusted publisher, so no npm token is needed;
      # an .npmrc with a token (setup-node's registry-url writes one) would get in the way.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
